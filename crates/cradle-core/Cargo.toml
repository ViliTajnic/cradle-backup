[package]
name = "cradle-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Device protocol, prechecks and backup orchestration for Cradle."

[dependencies]
# Pinned exactly per CLAUDE.md: idevice ships breaking changes on every point
# release before 0.2.0. Bumping this is a deliberate task with a full
# re-test against a real device, not a routine dependency update.
idevice = { version = "=0.1.65", default-features = true, features = [
    "usbmuxd",
    "mobilebackup2",
    "notification_proxy",
] }
plist = "1.8"
thiserror = "2"
tokio = { version = "1", features = ["fs", "rt", "time"] }
